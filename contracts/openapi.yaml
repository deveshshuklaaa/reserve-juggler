components:
  schemas:
    AccountingTotals:
      properties:
        realized_interest_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: -9007199254740991.0
          title: Realized Interest Cents
        average_checking_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Average Checking Cents
        average_invested_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Average Invested Cents
        penalties_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Penalties Cents
        borrowing_costs_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Borrowing Costs Cents
        borrowing_outstanding_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Borrowing Outstanding Cents
        reserve_breaches:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Reserve Breaches
        emergency_events:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Emergency Events
        failed_payouts:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Failed Payouts
        unpaid_payouts_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Unpaid Payouts Cents
        sweeps:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Sweeps
        net_benefit_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: -9007199254740991.0
          title: Net Benefit Cents
        contractual_penalties_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Contractual Penalties Cents
        liquidation_losses_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Liquidation Losses Cents
        transaction_costs_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Transaction Costs Cents
        realized_market_pnl_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: -9007199254740991.0
          title: Realized Market Pnl Cents
        accrued_interest_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: -9007199254740991.0
          title: Accrued Interest Cents
        unrealized_market_pnl_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: -9007199254740991.0
          title: Unrealized Market Pnl Cents
        unpaid_borrowing_costs_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Unpaid Borrowing Costs Cents
        ending_net_asset_value_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: -9007199254740991.0
          title: Ending Net Asset Value Cents
        customer_cash_delta_cents:
          type: integer
          maximum: 9007199254740991.0
          minimum: -9007199254740991.0
          title: Customer Cash Delta Cents
        model_evaluation:
          type: 'null'
          title: Model Evaluation
      additionalProperties: false
      type: object
      required:
      - realized_interest_cents
      - average_checking_cents
      - average_invested_cents
      - penalties_cents
      - borrowing_costs_cents
      - borrowing_outstanding_cents
      - reserve_breaches
      - emergency_events
      - failed_payouts
      - unpaid_payouts_cents
      - sweeps
      - net_benefit_cents
      - contractual_penalties_cents
      - liquidation_losses_cents
      - transaction_costs_cents
      - realized_market_pnl_cents
      - accrued_interest_cents
      - unrealized_market_pnl_cents
      - unpaid_borrowing_costs_cents
      - ending_net_asset_value_cents
      - customer_cash_delta_cents
      title: AccountingTotals
    AdvanceRequest:
      properties:
        expected_step:
          type: integer
          minimum: 0.0
          title: Expected Step
        steps:
          type: integer
          exclusiveMinimum: 0.0
          title: Steps
          default: 1
      additionalProperties: false
      type: object
      required:
      - expected_step
      title: AdvanceRequest
    AggregatesSnapshot:
      properties:
        gross_assets_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Gross Assets Cents
        total_liabilities_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Total Liabilities Cents
        net_portfolio_value_cents:
          type: integer
          title: Net Portfolio Value Cents
        total_immediate_liquidity_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Total Immediate Liquidity Cents
        total_realized_returns_cents:
          type: integer
          title: Total Realized Returns Cents
        total_unrealized_returns_cents:
          type: integer
          title: Total Unrealized Returns Cents
        net_financial_benefit_cents:
          type: integer
          title: Net Financial Benefit Cents
        checking_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Checking Cents
        required_reserve_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Required Reserve Cents
        deployable_surplus_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Deployable Surplus Cents
      additionalProperties: false
      type: object
      required:
      - gross_assets_cents
      - total_liabilities_cents
      - net_portfolio_value_cents
      - total_immediate_liquidity_cents
      - total_realized_returns_cents
      - total_unrealized_returns_cents
      - net_financial_benefit_cents
      - checking_cents
      - required_reserve_cents
      - deployable_surplus_cents
      title: AggregatesSnapshot
    BacktestReport:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        scenario:
          $ref: '#/components/schemas/Scenario'
        seed:
          type: integer
          title: Seed
        started_at:
          type: string
          format: date-time
          title: Started At
        ended_at:
          type: string
          format: date-time
          title: Ended At
        results:
          items:
            $ref: '#/components/schemas/ReportStrategyResult'
          type: array
          title: Results
        child_run_ids:
          additionalProperties:
            type: string
          type: object
          title: Child Run Ids
          default: {}
        execution_kind:
          type: string
          enum:
          - SHARED
          - TEST_DOUBLE
          title: Execution Kind
        engine_integration_sha:
          anyOf:
          - type: string
          - type: 'null'
          title: Engine Integration Sha
        conditions_sha256:
          type: string
          title: Conditions Sha256
        scenario_settings_json:
          type: string
          title: Scenario Settings Json
        model_evaluation:
          type: 'null'
          title: Model Evaluation
      additionalProperties: false
      type: object
      required:
      - run_id
      - scenario
      - seed
      - started_at
      - ended_at
      - results
      - execution_kind
      - engine_integration_sha
      - conditions_sha256
      - scenario_settings_json
      title: BacktestReport
    BacktestRequest:
      properties:
        strategies:
          items:
            type: string
            enum:
            - STATIC_RESERVE
            - REACTIVE_RESERVE
            - RESERVE_JUGGLER
          type: array
          minItems: 1
          title: Strategies
        retain_runs:
          type: boolean
          title: Retain Runs
          default: false
        days:
          anyOf:
          - type: integer
            enum:
            - 7
            - 14
            - 30
          - type: 'null'
          title: Days
        scenario:
          anyOf:
          - $ref: '#/components/schemas/Scenario'
          - type: 'null'
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
      additionalProperties: false
      type: object
      title: BacktestRequest
