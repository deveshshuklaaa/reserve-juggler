components:
  schemas:
    AdvanceRequest:
      properties:
        expected_step:
          type: integer
          minimum: 0.0
          title: Expected Step
        steps:
          type: integer
          exclusiveMinimum: 0.0
          title: Steps
          default: 1
      additionalProperties: false
      type: object
      required:
      - expected_step
      title: AdvanceRequest
    BacktestRequest:
      properties:
        strategies:
          items:
            type: string
            enum:
            - STATIC_RESERVE
            - REACTIVE_RESERVE
            - RESERVE_JUGGLER
          type: array
          minItems: 1
          title: Strategies
      additionalProperties: false
      type: object
      title: BacktestRequest
    BacktestResult:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        scenario:
          $ref: '#/components/schemas/Scenario'
        seed:
          type: integer
          title: Seed
        started_at:
          type: string
          format: date-time
          title: Started At
        ended_at:
          type: string
          format: date-time
          title: Ended At
        results:
          items:
            $ref: '#/components/schemas/StrategyResult'
          type: array
          title: Results
      additionalProperties: false
      type: object
      required:
      - run_id
      - scenario
      - seed
      - started_at
      - ended_at
      - results
      title: BacktestResult
    CreateRunRequest:
      properties:
        initial_cash_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Initial Cash Cents
          default: 2000000000
        duration_steps:
          type: integer
          exclusiveMinimum: 0.0
          title: Duration Steps
          default: 288
        seed:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Seed
          default: 42
        scenario:
          $ref: '#/components/schemas/Scenario'
          default: NORMAL
        start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Time
        policy:
          $ref: '#/components/schemas/TreasuryPolicy'
      additionalProperties: false
      type: object
      title: CreateRunRequest
    DecisionRecord:
      properties:
        action:
          type: string
          enum:
          - HOLD
          - SWEEP
          - WITHDRAW
          - LIQUIDITY_WARNING
          title: Action
        amount_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Amount Cents
        pre_checking_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Pre Checking Cents
        post_checking_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Post Checking Cents
        executed:
          type: boolean
          title: Executed
        explanation:
          items:
            type: string
          type: array
          title: Explanation
      additionalProperties: false
      type: object
      required:
      - action
      - amount_cents
      - pre_checking_cents
      - post_checking_cents
      - executed
      - explanation
      title: DecisionRecord
    ErrorResponse:
      properties:
        error_code:
          type: string
          title: Error Code
        message:
          type: string
          title: Message
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - items:
              additionalProperties: true
              type: object
            type: array
          title: Details
      additionalProperties: false
      type: object
      required:
      - error_code
      - message
      - details
      title: ErrorResponse
    FinancialMetrics:
      properties:
        realized_interest_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Realized Interest Cents
        accrued_interest_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Accrued Interest Cents
        average_checking_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Average Checking Cents
        average_vault_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Average Vault Cents
        redemption_penalties_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Redemption Penalties Cents
        emergency_borrowing_cost_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Emergency Borrowing Cost Cents
        emergency_events:
          type: integer
          minimum: 0.0
          title: Emergency Events
        reserve_breaches:
          type: integer
          minimum: 0.0
          title: Reserve Breaches
        failed_payouts:
          type: integer
          minimum: 0.0
          title: Failed Payouts
        unpaid_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Unpaid Cents
        net_benefit_cents:
          type: integer
          title: Net Benefit Cents
      additionalProperties: false
      type: object
      required:
      - realized_interest_cents
      - accrued_interest_cents
      - average_checking_cents
      - average_vault_cents
      - redemption_penalties_cents
      - emergency_borrowing_cost_cents
      - emergency_events
      - reserve_breaches
      - failed_payouts
      - unpaid_cents
      - net_benefit_cents
      title: FinancialMetrics
    ForecastSummary:
      properties:
        horizon_minutes:
          type: integer
          exclusiveMinimum: 0.0
          title: Horizon Minutes
          default: 1440
        peak_shortfall_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Peak Shortfall Cents
        uncertainty_buffer_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Uncertainty Buffer Cents
        operational_buffer_cents:
          type: integer
          maximum: 9.223372036854776e+18
          minimum: 0.0
          title: Operational Buffer Cents
        model_version:
          type: string
          title: Model Version
      additionalProperties: false
      type: object
      required:
      - peak_shortfall_cents
      - uncertainty_buffer_cents
      - operational_buffer_cents
      - model_version
      title: ForecastSummary
    HealthStatus:
      properties:
        status:
          type: string
          title: Status
        database:
          type: string
          title: Database
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - status
      - database
      - timestamp
      title: HealthStatus
    PerformanceReport:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        scenario:
          $ref: '#/components/schemas/Scenario'
        seed:
          type: integer
          title: Seed
        started_at:
          type: string
          format: date-time
          title: Started At
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
        metrics:
          anyOf:
          - $ref: '#/components/schemas/FinancialMetrics'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - run_id
      - scenario
      - seed
      - started_at
      - ended_at
      - metrics
      title: PerformanceReport
    PolicyPatch:
      properties:
        risk_percentile:
          anyOf:
          - type: number
            exclusiveMaximum: 1.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Risk Percentile
        operational_buffer_cents:
          anyOf:
          - type: integer
            maximum: 9.223372036854776e+18
            minimum: 0.0
          - type: 'null'
          title: Operational Buffer Cents
        minimum_sweep_cents:
          anyOf:
          - type: integer
            maximum: 9.223372036854776e+18
            minimum: 0.0
          - type: 'null'
          title: Minimum Sweep Cents
        vault_yield_bps:
          anyOf:
          - type: integer
            maximum: 10000.0
            minimum: 0.0
          - type: 'null'
          title: Vault Yield Bps
        vault_lock_steps:
